name: Screenshots

# Renders the editor's panels on the JVM (app/src/test/.../EditorScreenshots.kt) and commits the
# PNGs to screenshots/ on the same branch, so they can be looked at without a phone.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'app/src/main/java/dev/kogler/a7iiiconnect/develop/**'
      - 'app/src/test/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Render
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests '*EditorScreenshots*' --tests '*GpuParityTest*' 2>&1 | tee test.log
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Exception|FAILED" -A3 test.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
          find app/build/test-results -name '*.xml' -exec grep -l "<failure" {} \; | head -1 | xargs -r sed -n '1,80p'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/
      - name: Commit screenshots
        if: always()
        run: |
          ls app/build/screenshots/*.png >/dev/null 2>&1 || exit 0
          rm -rf screenshots && mkdir -p screenshots
          cp app/build/screenshots/* screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "Editor screenshots for ${GITHUB_SHA::7}" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
