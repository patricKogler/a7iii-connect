name: Screenshots

# Renders the editor's panels on the JVM (app/src/test/.../EditorScreenshots.kt) and commits the
# PNGs to the screenshots/<branch> branch, so they can be looked at without a phone.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'app/src/main/java/dev/kogler/a7iiiconnect/develop/**'
      - 'app/src/main/java/dev/kogler/a7iiiconnect/ui/**'
      - 'app/src/main/java/dev/kogler/a7iiiconnect/duo/**'
      - 'app/src/test/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Render
        # The editor's photo and RenderTest are drawn by Skia's software backend, which is slow.
        timeout-minutes: 25
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests '*EditorScreenshots*' --tests '*CameraScreenshots*' --tests '*RenderTest*' --tests '*DuelTest*' --tests '*LookTest*' --tests '*AlbumsTest*' --tests '*GridLinesTest*' --tests '*SmartTest*' --tests '*TogetherScreenshots*' --tests 'dev.kogler.a7iiiconnect.duo.*Test' 2>&1 | tee test.log
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Exception|FAILED" -A3 test.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
          find app/build/test-results -name '*.xml' -exec grep -l "<failure" {} \; | head -1 | xargs -r sed -n '1,80p'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/
      - name: Publish screenshots
        if: always()
        # To a side branch (screenshots/<branch>), so the PR branch gets no bot commits.
        run: |
          ls app/build/screenshots/*.png >/dev/null 2>&1 || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/shots.index"
          git --work-tree=app/build/screenshots add -A .
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "Editor screenshots for ${GITHUB_SHA::7}")
          git push -f origin "$commit:refs/heads/screenshots/${GITHUB_REF_NAME}"
