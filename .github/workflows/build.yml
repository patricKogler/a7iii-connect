name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 secret not set; signing with a throwaway debug key"
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        run: grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk a7iii-connect.apk
      - uses: actions/upload-artifact@v4
        with:
          name: a7iii-connect-apk
          path: a7iii-connect.apk
      - name: Publish as "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest a7iii-connect.apk \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_SHA}. Open this page on your phone and tap a7iii-connect.apk to install." \
            --target "$GITHUB_SHA"
