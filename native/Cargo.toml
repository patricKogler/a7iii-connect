[package]
name = "develop"
version = "0.1.0"
edition = "2021"
publish = false

# The full-size demosaic in Rust, called from Kotlin over JNI (the look itself runs on the GPU,
# see GpuPreview.kt). The Kotlin demosaic stays the reference and the fallback.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
jni-sys = "0.3"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
