[package]
name = "shootback-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
roxmltree = "0.20"
ureq = { version = "2.10", default-features = false }
kamadak-exif = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rayon = "1.10"
jpeg-decoder = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"
