# Shootback for Windows and Linux. `core` is the platform-free part (camera, FTP, library) that the
# phone app will share once the engine moves to Rust; `app` is the egui desktop app.
[workspace]
members = ["core", "app"]
resolver = "2"

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
